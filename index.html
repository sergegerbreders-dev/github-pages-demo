<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deploy Diary</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --ink: #1f2430;
      --accent: #2f6f4f;
      --muted: #6b7280;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181d;
        --card: #1f232b;
        --ink: #e8e6e1;
        --accent: #7fc8a4;
        --muted: #9aa0ab;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
      padding: 16px;
    }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 40px 44px;
      max-width: 520px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 6px; font-size: 1.8rem; }
    .version {
      display: inline-block;
      font-family: ui-monospace, Menlo, monospace;
      font-size: .8rem;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 2px 10px;
      margin-bottom: 18px;
    }
    p { line-height: 1.6; color: var(--muted); margin: 0 0 20px; }
    button {
      font: inherit;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      padding: 10px 22px;
      cursor: pointer;
    }
    button:active { transform: translateY(1px); }
    #count { font-weight: bold; color: var(--ink); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Deploy Diary</h1>
    <span class="version">v1 — first deployment</span>
    <p>
      This page was deployed straight from a git repository.
      Every <em>push</em> to the main branch rebuilds and republishes it
      automatically via GitHub Actions.
    </p>
    <p>You have pressed the button <span id="count">0</span> times on this device.</p>
    <button id="btn">Press me</button>
  </main>
  <script>
    const el = document.getElementById('count');
    let n = 0;
    try { n = parseInt(localStorage.getItem('presses') || '0', 10) || 0; } catch (e) {}
    el.textContent = n;
    document.getElementById('btn').addEventListener('click', () => {
      n += 1;
      el.textContent = n;
      try { localStorage.setItem('presses', String(n)); } catch (e) {}
    });
  </script>
</body>
</html>
